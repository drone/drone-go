---
kind: pipeline
type: docker
name: default

platform:
  os: linux
  arch: amd64

steps:
- name: vet
  image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10
  commands:
  - go vet ./...
  volumes:
  - name: gopath
    path: /go

- name: test
  image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10
  commands:
  - go test -cover ./...
  volumes:
  - name: gopath
    path: /go

volumes:
- name: gopath
  temp: {}

...
